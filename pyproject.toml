[project]
name = "travel-agent"
version = "0.1.0"
description = "旅游规划 Agent：LangGraph + FastAPI + 高德 MCP + A2A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "a2a-sdk>=1.1",
    "mcp>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# 定向过滤第三方噪声：仅忽略 a2a 包内 protobuf label() 弃用告警，不影响本项目自身告警
filterwarnings = [
    "ignore:.*label\\(\\) is deprecated.*:DeprecationWarning:a2a.*",
]

[tool.ruff]
line-length = 100
